# Dashboard theme -- a dark, prediction-market "terminal" palette (Kalshi-style: near-black
# canvas, Yes-green / No-red pricing, tabular numbers). Shipped with the package; the
# `soccer dashboard` command runs streamlit from this directory so this file is picked up.
[theme]
base = "dark"
primaryColor = "#16c784"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#171b24"
textColor = "#e6e9ef"
linkColor = "#16c784"
borderColor = "#262b36"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseFontSize = 15
headingFontWeights = [700, 700, 600, 600, 600, 600]
chartCategoricalColors = ["#16c784", "#3b82f6", "#ea3943", "#f0a020", "#a855f7", "#22d3ee", "#8b95a1"]
grayColor = "#8b95a1"
greenColor = "#16c784"
redColor = "#ea3943"
blueColor = "#3b82f6"
orangeColor = "#f0a020"

[theme.sidebar]
backgroundColor = "#0b0e14"
secondaryBackgroundColor = "#141922"
borderColor = "#262b36"

[server]
# The dashboard is read-only; no need to watch for edits in production use.
fileWatcherType = "auto"
