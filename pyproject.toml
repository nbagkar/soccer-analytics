[project]
name = "soccer-analytics"
version = "0.1.0"
description = "Local-first football intelligence centre built on free and open data"
# No upper cap: the old <3.13 ceiling came from socceraction, dropped 2026-10-06 in favour
# of a hand-rolled expected-threat model (soccer.models.xthreat). CI tests 3.12.
requires-python = ">=3.12"

dependencies = [
    # numpy powers the Monte Carlo simulation; scipy fits the Dixon-Coles model.
    # NOT pinned <2: nothing here needs numpy 1.x (the old pin came from socceraction).
    "numpy>=1.26",
    "scipy>=1.11",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "polars>=1.0",
    "duckdb>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
# pandas is already pulled in transitively (altair/streamlit need it for `.to_pandas()`
# frames); listed explicitly because dashboard/app.py now imports it directly for typing.
dashboard = ["streamlit>=1.36", "plotly>=5.22", "mplsoccer>=1.4", "pandas>=2.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    # Type stubs so `strict = true` below is actually checkable, not silently skipped.
    "scipy-stubs>=1.11",
    "pandas-stubs>=2.0",
]

[project.scripts]
soccer = "soccer.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soccer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# Deliberate typography in user-facing text: "×1.20" multipliers and "62–74 pts" ranges.
allowed-confusables = ["×", "–"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
