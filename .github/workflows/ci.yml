# Mistake-proofing: every push and PR must pass lint, formatting, strict typing and the full
# test suite before it counts as done. Free on GitHub-hosted runners; no secrets needed --
# tests never touch the network (sources are mocked) or the local data/ directory.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dashboard,dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format
        run: ruff format --check src tests

      - name: Types
        run: mypy src

      - name: Tests
        # Failing test names are re-emitted as annotations, so a red run says *what* broke
        # on the public run page -- the raw log needs a GitHub login to read.
        run: |
          set -o pipefail
          pytest -q -rf --tb=short | tee pytest.log || {
            grep -E '^(FAILED|ERROR) ' pytest.log | sed 's/^/::error title=pytest::/'
            exit 1
          }
